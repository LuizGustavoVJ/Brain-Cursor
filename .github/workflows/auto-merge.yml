name: Auto-merge after CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Merge PR quando checks verdes (sem review humana)
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: 'open', per_page: 100 }
            );
            const pr = pulls.find(p => p.head.sha === run.head_sha);
            if (!pr) {
              core.info('Nenhum PR aberto para head_sha=' + run.head_sha);
              return;
            }
            const base = pr.base.ref;
            const head = pr.head.ref;
            const allowed =
              (base === 'staging' && head !== 'staging') ||
              (base === 'main' && head === 'staging');
            if (!allowed) {
              core.info('PR #' + pr.number + ' fora do escopo auto-merge (base=' + base + ', head=' + head + ')');
              return;
            }

            const { data: fresh } = await github.rest.pulls.get({
              owner, repo, pull_number: pr.number,
            });
            if (!fresh.mergeable) {
              core.warning('PR #' + pr.number + ' ainda não mergeável.');
              return;
            }

            try {
              await github.graphql(
                `mutation ($pr: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pr, mergeMethod: MERGE }) {
                    pullRequest { autoMergeRequest { enabledAt } }
                  }
                }`,
                { pr: fresh.node_id }
              );
              core.info('Auto-merge habilitado para PR #' + pr.number);
            } catch (e) {
              core.info('enablePullRequestAutoMerge: ' + e.message + ' — tentando merge direto');
              await github.rest.pulls.merge({
                owner, repo, pull_number: pr.number, merge_method: 'merge',
              });
              core.info('PR #' + pr.number + ' mergeado.');
            }

      - name: Comentário no PR (merge automático)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: 'open', per_page: 100 }
            );
            const pr = pulls.find(p => p.head.sha === run.head_sha);
            if (!pr) return;
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number,
              body: 'CI verde (`lint-and-test`) — **merge automático** (esteira full-auto, sem `/approve`).',
            });