name: Auto-merge after approval

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  merge-after-approval:
    runs-on: ubuntu-latest
    if: >-
      github.event.review.state == 'approved' &&
      (github.event.pull_request.base.ref == 'staging' ||
       github.event.pull_request.base.ref == 'main')
    steps:
      - name: Merge após aprovação (Luiz aprova; não use Merge no GitHub)
        uses: actions/github-script@v7
        env:
          APPROVER: ${{ github.event.review.user.login }}
        with:
          script: |
            const allowed = ['luizgustavovj'];
            const approver = (process.env.APPROVER || '').toLowerCase();
            if (!allowed.includes(approver)) {
              core.info('Review de ' + approver + ' ignorado.');
              return;
            }
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const prNumber = pr.number;
            const base = pr.base.ref;
            const requiredContext = base === 'staging' ? 'lint-and-test' : null;

            if (requiredContext) {
              for (let i = 0; i < 40; i++) {
                const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                  owner,
                  repo,
                  ref: pr.head.sha,
                });
                const ctx = combined.statuses.find(s => s.context === requiredContext);
                if (ctx?.state === 'success') break;
                if (ctx?.state === 'failure' || ctx?.state === 'error') {
                  throw new Error('Check ' + requiredContext + ' falhou.');
                }
                if (i === 39) throw new Error('Timeout aguardando ' + requiredContext);
                await new Promise(r => setTimeout(r, 10000));
              }
            }

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            if (!pull.mergeable) {
              throw new Error('PR #' + prNumber + ' não mergeável.');
            }
            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: prNumber,
              merge_method: 'merge',
            });
            core.notice('PR #' + prNumber + ' mergeado em ' + base + ' após Approve.');