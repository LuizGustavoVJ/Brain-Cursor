name: Auto-merge after approval

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'staging'
    steps:
      - name: Habilitar auto-merge quando checks verdes
        uses: actions/github-script@v7
        env:
          APPROVER: ${{ github.event.review.user.login }}
        with:
          script: |
            const allowed = (process.env.APPROVER || '').toLowerCase();
            const owners = ['luizgustavovj'];
            if (!owners.includes(allowed)) {
              core.info('Review de ' + allowed + ' — auto-merge só para ' + owners.join(', '));
              return;
            }
            const pr = context.payload.pull_request;
            try {
              await github.graphql(
                `mutation ($pr: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pr, mergeMethod: MERGE }) {
                    pullRequest { autoMergeRequest { enabledAt } }
                  }
                }`,
                { pr: pr.node_id }
              );
              core.info('Auto-merge habilitado para PR #' + pr.number);
            } catch (e) {
              core.setFailed('Falha ao habilitar auto-merge: ' + e.message);
            }

      - name: Aguardar status CI (opcional)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: mergeable } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pr.number,
            });
            if (!mergeable.mergeable) {
              core.warning('PR ainda não mergeável — conflitos ou checks pendentes.');
            }