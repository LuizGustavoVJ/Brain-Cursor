name: Approve via comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  approve-and-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/approve') &&
      github.event.comment.user.login == 'LuizGustavoVJ'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;
            const pull_number = issue.number;

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });
            if (pr.state !== 'open') {
              core.info('PR já fechado.');
              return;
            }

            const requiredContext = 'lint-and-test';
            for (let i = 0; i < 40; i++) {
              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: pr.head.sha,
              });
              const ctx = combined.statuses.find(s => s.context === requiredContext);
              if (ctx?.state === 'success') break;
              if (ctx?.state === 'failure' || ctx?.state === 'error') {
                throw new Error('CI ' + requiredContext + ' falhou.');
              }
              if (i === 39) throw new Error('Timeout aguardando ' + requiredContext);
              await new Promise(r => setTimeout(r, 10000));
            }

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number,
              event: 'APPROVE',
              body: 'Aprovação via comentário `/approve` (GitHub Actions).',
            });

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
            });
            if (!pull.mergeable) {
              throw new Error('PR #' + pull_number + ' ainda não mergeável.');
            }

            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number,
              merge_method: 'merge',
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body: 'Aprovado e mergeado após `/approve` de @LuizGustavoVJ (review do bot + merge).',
            });