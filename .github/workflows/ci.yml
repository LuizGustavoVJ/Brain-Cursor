name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: bash scripts/ci-lint.sh
      - name: Test
        run: bash scripts/ci-test.sh

  # Fallback: merge no próprio CI (não depende só de workflow_run na default branch).
  merge-staging-pr:
    needs: lint-and-test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'staging' &&
      github.event.pull_request.head.ref != 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Merge PR em staging após lint-and-test
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const { data: fresh } = await github.rest.pulls.get({
              owner, repo, pull_number: pr.number,
            });
            if (fresh.merged || !fresh.mergeable) {
              core.info('PR #' + pr.number + ' já mergeado ou não mergeável.');
              return;
            }
            try {
              await github.graphql(
                `mutation ($pr: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pr, mergeMethod: MERGE }) {
                    pullRequest { autoMergeRequest { enabledAt } }
                  }
                }`,
                { pr: fresh.node_id }
              );
            } catch (e) {
              await github.rest.pulls.merge({
                owner, repo, pull_number: pr.number, merge_method: 'merge',
              });
            }